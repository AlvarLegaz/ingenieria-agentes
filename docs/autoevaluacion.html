  .opt:disabled { cursor: default; }
  .opt.ok { border-color: var(--ok); background: var(--ok-soft); }
  .opt.ko { border-color: var(--ko); background: var(--ko-soft); }
  .fb { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; }
  .fb.show { display: block; }
  .fb.ok { background: var(--ok-soft); }
  .fb.ko { background: var(--ko-soft); }
  .fb strong { display: block; margin-bottom: 4px; }
  .fb .ref { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  .fb a { color: var(--accent); }
  .nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 16px; }
  .btn {
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg);
    border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0 4px; font-size: .95rem; }
  td, th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-size: 2.2rem; font-weight: 700; margin: 4px 0; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 14px; text-align: center; }
  .code {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: -4px 0 16px; white-space: pre-wrap; overflow-wrap: anywhere;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em;
    background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere;
  }
</style>
</head>

</main>

   e:"Write escribe el archivo completo. Para crear archivos nuevos es la adecuada; para cambiar una parte de uno existente, no, porque hay que reenviar todo y se pueden perder líneas.", r:[34]},
  {s:1, q:"¿Qué hace la herramienta Edit (en otros agentes, `str_replace` o `apply_patch`)?",
   o:["Sustituye un fragmento exacto de un archivo por otro nuevo","Abre el archivo en el editor del usuario para que lo cambie","Reescribe el archivo entero con una versión mejorada","Deshace el último cambio que se hizo sobre el archivo"],
   e:"Edit recibe el texto antiguo y el nuevo, y cambia solo eso. Es más barata y más segura que reescribir el archivo, porque no toca el resto.", r:[34]},
  {s:1, q:"El agente tiene que cambiar una línea de un archivo de 800 líneas. ¿Qué herramienta es la adecuada?",
   o:["Edit: cambia solo ese fragmento","Write: reescribe el archivo entero","Bash con `echo` sobre el archivo","Read: el cambio se hace al leerlo"],
   e:"Con Write habría que enviar las 800 líneas (muchos tokens) y cualquier descuido borraría código. Edit cambia solo lo necesario.", r:[34]},
  {s:1, q:"Edit falla con el aviso de que el texto a sustituir aparece dos veces en el archivo. ¿Por qué?",
   o:["Necesita un texto único para saber cuál de los dos cambiar","Edit solo puede modificar la primera línea de cada archivo","El archivo está bloqueado porque otro agente lo está editando","Edit no admite textos de más de una línea en ningún caso"],
   e:"Si el fragmento no es único, la herramienta no sabe dónde aplicar el cambio. La solución es incluir más líneas alrededor para que sea único (o pedir explícitamente cambiar todas las apariciones).", r:[34]},
  {s:1, q:"¿Qué hace la herramienta Glob?",
   o:["Encuentra archivos cuyo nombre o ruta encaja con un patrón","Busca un texto dentro del contenido de todos los archivos","Agrupa varios archivos en uno solo para leerlos de una vez","Ejecuta un comando sobre todos los archivos de una carpeta"],
   e:"Glob trabaja con nombres y rutas: `src/**/*.ts` devuelve todos los .ts bajo src. No mira lo que hay dentro de los archivos.", r:[34]},
  {s:1, q:"¿Qué hace la herramienta Grep?",
   o:["Busca un texto o expresión regular dentro de los archivos","Encuentra archivos por su nombre o por su extensión","Muestra las diferencias entre dos versiones de un archivo","Ordena alfabéticamente las líneas de un archivo de texto"],
   e:"Grep busca en el contenido y devuelve los archivos o las líneas que coinciden. Suele estar implementada con ripgrep, que es muy rápido.", r:[34]},
  {s:1, q:"Quieres saber en qué archivos se llama a la función `calcularIva`. ¿Qué herramienta usa el agente?",
   o:["Grep","Glob","Read","Write"],
   e:"Es una búsqueda por contenido: Grep con `calcularIva` devuelve dónde aparece. Glob solo vería nombres de archivo, y leer los archivos uno a uno con Read llenaría el contexto.", r:[34]},
  {s:1, q:"Quieres la lista de todos los archivos de test, que terminan en `.test.ts`. ¿Qué herramienta usa el agente?",
   o:["Glob: `**/*.test.ts`","Grep con `test`","Read de la carpeta","Edit sobre `*.ts`"],
   e:"Es una búsqueda por nombre: Glob. Grep con «test» devolvería además cualquier archivo que contenga esa palabra.", r:[34]},
  {s:1, q:"¿Qué hace la herramienta Bash (o shell, terminal)?",
   o:["Ejecuta un comando en la terminal y devuelve su salida","Explica qué hace un comando sin llegar a ejecutarlo","Traduce las órdenes en español a comandos de Linux","Instala la terminal Bash en equipos con Windows"],
   e:"Con Bash el agente puede ejecutar tests, compilar, usar git o instalar dependencias. Es la herramienta más potente y la más peligrosa, por eso suele pedir permiso.", r:[34]},
  {s:1, q:"El agente quiere comprobar si su cambio rompe algo ejecutando `npm test`. ¿Qué herramienta usa?",
   o:["Bash","Read","Grep","Edit"],
   e:"Ejecutar algo (tests, build, linter) requiere la terminal. Las otras solo leen, buscan o modifican archivos.", r:[34]},
  {s:1, q:"El agente podría leer un archivo con `cat` desde Bash, pero usa Read. ¿Qué ventaja tiene?",
   o:["Read es de solo lectura y se puede permitir sin riesgo","Read lee el archivo más rápido que cualquier comando","`cat` no funciona con archivos de código fuente","Read corrige los errores del archivo al leerlo"],
   e:"Una herramienta específica hace solo una cosa, así que se puede autorizar con tranquilidad. Bash puede hacer cualquier cosa, y permitirlo abre la puerta a comandos peligrosos.", r:[34]},
  {s:1, q:"¿Cuál de estas herramientas suele poder usarse sin pedirte permiso?",
   o:["Grep","Bash","Write","Edit"],
   e:"Las herramientas de solo lectura (Read, Glob, Grep) normalmente no piden aprobación. Las que ejecutan o modifican (Bash, Write, Edit, WebFetch) sí, salvo que las permitas expresamente.", r:[34]},
  {s:1, q:"¿Qué muestra un diff, por ejemplo con `git diff`?",
   o:["Las líneas añadidas y quitadas entre dos versiones","Los errores que ha detectado el compilador en el código","La lista de commits que se han hecho en el repositorio","Las ramas que existen en el repositorio y cuál está activa"],
   e:"El diff es la forma de revisar qué ha cambiado realmente el agente, línea a línea. Un buen evaluador revisa el diff además de ejecutar los tests.", r:[37]},
  {s:1, q:"¿Qué hace una herramienta como LS (listar directorio)?",
   o:["Muestra los archivos y carpetas que hay en una ruta","Busca un texto en los archivos de una carpeta","Borra los archivos temporales de una carpeta","Muestra el contenido de todos los archivos"],
   e:"Sirve para orientarse en el proyecto. En muchos agentes se hace con Glob o con `ls` desde la terminal.", r:[34]},
  {s:1, q:"¿Qué hace la herramienta WebSearch?",
   o:["Busca en internet y devuelve una lista de resultados","Descarga una página concreta a partir de su URL","Busca un texto dentro de los archivos del proyecto","Abre un navegador para que el usuario busque"],
   e:"WebSearch es un buscador: devuelve títulos y enlaces. Para leer una página concreta se usa WebFetch.", r:[34]},
  {s:1, q:"Tienes la URL de la documentación de una librería y quieres que el agente la lea. ¿Qué herramienta usa?",
   o:["WebFetch","WebSearch","Read","Grep"],
   e:"WebFetch descarga una URL concreta y pasa su contenido al modelo. Read solo lee archivos locales, y WebSearch buscaría en vez de ir a esa página.", r:[34]},
  {s:1, q:"¿Qué hace la herramienta Task o Agent?",
   o:["Delega una tarea en un subagente con su contexto","Crea una tarea pendiente en la lista del usuario","Programa una tarea para que se ejecute más tarde","Cambia el modelo con el que trabaja el agente"],
   e:"Con ella el agente principal delega en un subagente, que trabaja en una ventana de contexto separada y le devuelve un resumen.", r:[21]},
  {s:1, q:"¿Para qué sirve una herramienta de lista de tareas (TodoWrite, plan)?",
   o:["Para llevar la cuenta de los pasos pendientes y hechos","Para enviar recordatorios al usuario por correo electrónico","Para repartir el trabajo entre varios programadores humanos","Para guardar el plan en memoria entre una sesión y otra"],
   e:"En tareas largas, la lista mantiene el objetivo a la vista y deja ver el progreso. Vive en la sesión: no es memoria permanente.", r:[34]},
  {s:1, q:"¿Para qué sirve una herramienta como AskUserQuestion?",
   o:["Para que el agente pregunte y espere tu respuesta antes de seguir","Para que el usuario pregunte al agente sobre el código del proyecto","Para buscar la respuesta a una pregunta en foros de internet","Para que un subagente consulte dudas al agente principal"],
   e:"Cuando hay una decisión que no puede deducir (qué opción prefieres, un dato que falta), el agente pregunta en vez de adivinar.", r:[34]},
  {s:1, q:"¿Qué aporta una herramienta LSP (servidor de lenguaje)?",
   o:["Ir a definiciones, buscar referencias y ver errores de tipos","Traducir el código de un lenguaje de programación a otro","Conectar el agente con modelos de otros proveedores","Ejecutar el código en un entorno aislado y seguro"],
   e:"Es lo mismo que usa el editor para «ir a la definición». Da información exacta del código, más fiable que buscar texto con Grep.", r:[34]},
  {s:1, q:"¿Qué hace la herramienta NotebookEdit?",
   o:["Modifica celdas de un cuaderno Jupyter (.ipynb)","Toma notas de la sesión para recordarlas luego","Edita el archivo de notas del proyecto (NOTES.md)","Abre un cuaderno nuevo en el navegador del usuario"],
   e:"Un .ipynb es un JSON con celdas. Editarlo como texto es frágil; esta herramienta cambia celdas concretas.", r:[34]},
  {s:1, q:"¿Qué es MCP (Model Context Protocol)?",
   o:["Un estándar para conectar herramientas externas a un agente","Un modelo de lenguaje especializado en gestionar el contexto","Un formato de archivo para guardar las instrucciones del proyecto","Una técnica para comprimir el contexto cuando se llena"],
   e:"Un servidor MCP expone herramientas (consultar una base de datos, usar GitHub, un navegador…) que cualquier agente compatible puede usar, sea del proveedor que sea.", r:[35]},
  {s:1, q:"¿Cómo decide el modelo qué herramienta usar en cada paso?",
   o:["Por el nombre y la descripción de cada una, que tiene en su contexto","Las usa en un orden fijo que viene definido por la herramienta","Las prueba todas y se queda con la que da mejor resultado","Las elige el usuario en cada paso desde un menú de opciones"],
   e:"La lista de herramientas, con su descripción y sus parámetros, va en el contexto. Por eso una descripción clara importa, y por eso tener demasiadas herramientas confunde al modelo.", r:[35,2]},
  {s:1, q:"A un subagente revisor le das solo Read, Grep y Glob. ¿Qué consigues?",
   o:["Que pueda leer y buscar, pero no modificar ni ejecutar nada","Que trabaje más rápido, pero con los mismos permisos que el resto","Que no pueda leer los archivos de configuración del proyecto","Nada: los subagentes ignoran la lista de herramientas"],
   e:"Las herramientas que tiene un agente definen lo que puede hacer. Sin Edit, Write ni Bash, el revisor no puede cambiar lo que revisa.", r:[21]},
  {s:1, q:"¿Qué es el «modo plan» de muchas herramientas de agentes?",
   o:["Un modo en que el agente solo investiga y propone un plan","Un modo en que el agente ejecuta un plan sin pedir ningún permiso","Una herramienta que dibuja el diagrama de la arquitectura del proyecto","Una tarifa del proveedor que limita los tokens que se pueden gastar"],
   e:"En modo plan el agente solo usa herramientas de lectura y termina presentando un plan para que lo apruebes. Solo entonces empieza a editar.", r:[34]},
  {s:2, q:"Un agente cumple bien las instrucciones al principio de una sesión larga, pero tras horas de trabajo empieza a ignorar algunas que antes respetaba. ¿Qué lo explica mejor?",
   o:["Al crecer el contexto y avanzar la sesión, cada instrucción pesa menos y se cumple peor","Los modelos se cansan como las personas y necesitan pausas entre tareas largas","Claude Code deja de releer CLAUDE.md pasada la primera hora de sesión","El agente aprende durante la sesión que puede saltarse las reglas sin consecuencias"],
   e:"Cuanto más contexto acumula la sesión, menos peso relativo tiene cada instrucción. Se ha medido tanto en la degradación con contextos largos como en el cumplimiento de instrucciones a lo largo de una sesión de programación.", r:[4,2,33]},
  {s:2, q:"Ante esa degradación, ¿qué práctica conviene en una tarea que va a durar varias sesiones?",
   o:["Dejar una nota de traspaso con estado y siguiente paso, y seguir en una sesión nueva","Repetir las instrucciones importantes en mayúsculas cada cierto tiempo en el chat","Añadir más reglas a CLAUDE.md para que las importantes queden más reforzadas","Pedir al agente que relea todo el historial completo antes de cada nuevo paso"],
   e:"Una sesión nueva parte de un contexto limpio, y la nota de traspaso conserva lo esencial sin arrastrar todo el historial.", r:[7,4]},
  {s:2, q:"Un dato crítico está en medio de un documento muy largo que el agente tiene cargado en su contexto. ¿Qué riesgo hay?",
   o:["Que lo pase por alto: lo que queda en medio de un contexto largo se aprovecha peor","Ninguno: todo lo que está en el contexto el modelo lo usa por igual siempre","Que el agente no pueda abrir el documento por superar el tamaño permitido","Que el agente reescriba el documento para resumirlo y el dato se pierda"],
   e:"Estar en el contexto no garantiza que el modelo lo tenga en cuenta. Por eso conviene darle al agente poco contexto y muy relevante.", r:[3,2]},
  {s:2, q:"¿Por qué se dice que el contexto de un agente es un recurso finito?",
   o:["Cada token añadido aporta menos y diluye la atención sobre lo importante","Claude Code cobra por mensaje, así que conviene enviar pocos y largos","El agente borra todo lo que tiene en contexto cuando pasan 24 horas","El modelo no puede leer archivos de más de cien líneas de una vez"],
   e:"Más contexto no es mejor contexto: lo que no hace falta compite con lo que sí.", r:[2,33]},
  {s:2, q:"¿Qué tipo de información merece estar en el CLAUDE.md de un proyecto?",
   o:["Lo que no deduciría leyendo el código: comandos, convenciones propias, trampas","Una descripción de cada carpeta y archivo para que se oriente más rápido","Las buenas prácticas generales de programación que debe seguir siempre","La historia del proyecto y del equipo para que entienda el contexto"],
   e:"Los archivos de contexto son útiles para lo que el agente no puede averiguar por sí mismo; lo demás solo añade coste.", r:[10]},
  {s:2, q:"Un equipo pone en su CLAUDE.md una descripción detallada de cada carpeta del repositorio. ¿Por qué no suele ayudar?",
   o:["El agente ya descubre la estructura leyendo el código, y ese texto encarece cada sesión","Claude Code no interpreta listas en CLAUDE.md y las ignora por completo","El agente solo obedece la primera sección del archivo y descarta el resto","Las rutas de carpetas confunden al modelo y le hacen editar archivos equivocados"],
   e:"Describir el repositorio no mejora el porcentaje de tareas resueltas y sí encarece cada sesión.", r:[10]},
  {s:2, q:"Escribir una regla en CLAUDE.md, ¿garantiza que el agente la cumpla siempre?",
   o:["No: es contexto que el modelo tiene en cuenta, no una configuración que se imponga","Sí: Claude Code bloquea automáticamente cualquier acción que la contradiga","Sí, siempre que esté escrita en mayúsculas o marcada como IMPORTANTE","Solo si está entre las diez primeras líneas, que son las que se aplican"],
   e:"Lo que deba cumplirse siempre hay que garantizarlo con mecanismos, como hooks o permisos.", r:[12,23]},
  {s:2, q:"¿Qué ventaja tiene guardar un conocimiento especializado en un skill en lugar de en CLAUDE.md?",
   o:["Solo se carga entero cuando la tarea lo necesita; antes, solo su descripción","Un skill se ejecuta en otra máquina y no consume recursos de la sesión","Los skills son de obligado cumplimiento y CLAUDE.md es solo orientativo","Los skills los comparte Anthropic con otros usuarios y se mejoran solos"],
   e:"Es la carga progresiva: permite tener mucho conocimiento disponible sin que ocupe contexto mientras no se usa.", r:[13]},
  {s:2, q:"Un agente tiene 80 herramientas definidas y empieza a equivocarse al elegir cuál usar. ¿Qué conviene hacer?",
   o:["Cargar a la vez solo las herramientas necesarias y el resto bajo demanda","Añadir una herramienta más que se encargue de elegir entre las otras 80","Listar en CLAUDE.md las herramientas por orden de importancia para guiarlo","Cambiar a un modelo más pequeño, que se distrae menos con tantas opciones"],
   e:"Con demasiadas herramientas definidas a la vez, la elección empeora. La carga bajo demanda lo evita.", r:[13]},
  {s:2, q:"Un archivo de contexto no aumenta el porcentaje de tareas que el agente resuelve. ¿Puede seguir mereciendo la pena?",
   o:["Sí, si ahorra tiempo o tokens o asegura convenciones propias; hay que medirlo","No: si no sube el porcentaje de éxito, siempre conviene eliminarlo del todo","Sí, siempre, y cuanto más largo sea el archivo, mejor será el resultado","No: estos archivos solo tienen sentido en proyectos con muchos desarrolladores"],
   e:"Los estudios muestran efectos distintos según lo que se mida: éxito, coste o tiempo. La decisión depende de cada proyecto.", r:[10,11]},
  {s:2, q:"¿Dónde conviene describir qué funcionalidades debe tener el proyecto, con sus criterios de aceptación?",
   o:["En una especificación aparte que el agente lee cuando la tarea lo necesita","En CLAUDE.md, para que el agente las tenga presentes en todas las sesiones","En el README, junto a las instrucciones de instalación y de ejecución","En comentarios dentro del código, al lado de donde se implementa cada una"],
   e:"La especificación dice qué debe hacer el proyecto; CLAUDE.md, cómo se trabaja; el README presenta el proyecto a las personas.", r:[0]},
  {s:2, q:"En un proyecto que usa agentes, ¿para quién es el README?",
   o:["Para las personas: qué es el proyecto y cómo ponerlo en marcha","Para el agente: es lo primero que Claude Code carga en cada sesión","Para el evaluador: es donde se guardan los criterios de aceptación","Para GitHub: sin README no se puede publicar ni clonar el repositorio"],
   e:"Cada documento tiene un lector y un momento de lectura distintos. Mezclarlos alarga lo que el agente carga y confunde a las personas.", r:[0]},
  {s:3, q:"Al diseñar un sistema basado en agentes, ¿por dónde conviene empezar?",
   o:["Por un solo agente, y añadir otros solo ante un problema concreto","Por un agente para cada rol del equipo humano que haría el trabajo","Por tantos agentes como módulos tenga el proyecto, uno para cada uno","Por un agente de cada proveedor de modelos, para comparar resultados"],
   e:"Los sistemas multiagente se usan a menudo donde un solo agente funcionaría igual o mejor, con menos coste y menos complejidad.", r:[15]},
  {s:3, q:"¿Qué coste tiene pasar de un agente a varios para resolver la misma tarea?",
   o:["Varias veces más tokens, más la coordinación entre agentes","Ninguno: el trabajo se reparte y el coste total es el mismo","Solo un poco más de tiempo al arrancar cada uno de los agentes","Que cada agente adicional necesita su propia licencia de uso"],
   e:"El contexto se duplica entre agentes y hay mensajes y resúmenes en cada traspaso. Solo compensa si el beneficio es mayor.", r:[15]},
  {s:3, q:"¿En cuál de estas tareas tiene más sentido repartir el trabajo entre varios agentes en paralelo?",
   o:["Investigar cinco librerías independientes y resumir cada una","Implementar una función y el test que la comprueba a la vez","Corregir un error localizado en un único archivo del proyecto","Renombrar una variable que se usa en todo el proyecto"],
   e:"Las líneas de investigación independientes, que solo leen, son el caso en que el trabajo multiagente da mejores resultados.", r:[15,16]},
  {s:3, q:"Dos agentes programan a la vez funcionalidades distintas en el mismo repositorio. ¿Qué es lo más probable?",
   o:["Que rindan peor que uno solo por suponer mal lo que hace el otro","Que terminen en la mitad de tiempo y con la misma calidad final","Que el resultado sea idéntico al de un solo agente, pero más caro","Que Claude Code no les deje trabajar a la vez en el mismo repositorio"],
   e:"Coordinarse es difícil incluso cuando se comunican: cada uno supone mal el plan del otro. Por eso conviene que escriba un solo agente.", r:[17]},
  {s:3, q:"¿Qué significa mantener las escrituras en un solo hilo?",
   o:["Que solo un agente modifica archivos, aunque otros analicen o revisen","Que el agente escribe los archivos de uno en uno, nunca varios a la vez","Que solo se puede tener una sesión de Claude Code abierta a la vez","Que todos los cambios de una tarea se guardan en un único commit"],
   e:"Varios agentes pueden aportar análisis; los problemas aparecen cuando varios escriben sobre lo mismo.", r:[19,17]},
  {s:3, q:"¿Por qué la investigación se presta más al trabajo con varios agentes que la programación?",
   o:["Sus líneas son independientes y solo se lee; al programar, las partes dependen entre sí","Los modelos investigan mejor de lo que programan, sea cual sea la tarea","Programar necesita más memoria del equipo que buscar información","Los agentes no pueden ejecutar código en paralelo, pero sí buscar"],
   e:"La clave es si las partes del trabajo se pueden hacer sin depender unas de otras.", r:[16,15]},
  {s:3, q:"Un sistema de varios agentes da resultados parecidos a los de uno solo, pero cuesta bastante más. ¿Qué conviene hacer?",
   o:["Simplificarlo a un solo agente: la complejidad no se está pagando","Añadir más agentes hasta que la mejora compense el coste","Mantenerlo: tener más agentes siempre lo hace más robusto","Usar el modelo más grande en todos los agentes del sistema"],
   e:"Los fallos de coordinación son frecuentes y conocidos; si no hay mejora medible, la complejidad no compensa.", r:[20,15]},
  {s:3, q:"¿En qué situación está justificado separar parte del trabajo en otro agente?",
   o:["Contexto saturado, tareas paralelas independientes o mejor uso de herramientas","Siempre que la tarea tenga más de un paso o afecte a más de un archivo","Cuando en el proyecto trabaja más de un desarrollador humano a la vez","Cuando el agente principal tarda más de diez minutos en responder"],
   e:"Fuera de esos casos, el coste de coordinación suele superar al beneficio.", r:[15,13]},
  {s:4, q:"¿Qué aporta realmente un subagente?",
   o:["Una ventana de contexto propia que no llena la del agente principal","Un modelo distinto y más inteligente que el del agente principal","Acceso a internet y a herramientas que el agente principal no tiene","Memoria permanente que se conserva de una sesión a la siguiente"],
   e:"Su utilidad está en aislar contexto. Por eso conviene usarlo para trabajos que llenarían el contexto principal o que necesitan independencia.", r:[21]},
  {s:4, q:"Un equipo crea un subagente por cada rol humano: planificador, programador, tester y documentador, que se pasan el trabajo en cadena. ¿Qué problema aparece?",
   o:["La información se degrada en cada traspaso, como en un «teléfono roto»","Los subagentes trabajan tan rápido que el usuario no puede revisarlos","Faltan roles de seguridad y de rendimiento para que el equipo esté completo","Ninguno: copiar la organización humana es la forma más robusta"],
   e:"Cada agente recibe solo un resumen del anterior y pierde detalles. Las fases sucesivas de un mismo trabajo conviene que las haga un solo agente.", r:[15,13]},
  {s:4, q:"¿Cuál de estas es una buena frontera para separar trabajo en otro agente?",
   o:["La verificación de caja negra de un resultado terminado","Dividir una funcionalidad en diseño, código y pruebas","Un agente distinto para cada archivo del proyecto","Un agente distinto para cada lenguaje de programación"],
   e:"Las buenas fronteras son las que necesitan poco contexto compartido: líneas de investigación independientes, componentes con interfaces limpias y verificación.", r:[15]},
  {s:4, q:"¿Por qué un subagente que solo verifica no sufre el problema del «teléfono roto»?",
   o:["Solo necesita saber si el resultado cumple los criterios, no cómo se hizo","Usa siempre el modelo más potente, que no pierde información en traspasos","Se ejecuta antes que el agente principal y así no recibe ningún traspaso","Comparte la misma ventana de contexto que el agente principal en todo momento"],
   e:"Verificar necesita poco contexto: el resultado y los criterios. No hay que traspasarle todo lo que pasó durante la implementación.", r:[15]},
  {s:4, q:"Hay que dar al agente conocimiento sobre diseño de interfaces, que no necesita un contexto aislado. ¿Cómo conviene hacerlo?",
   o:["Como un skill que el agente principal carga cuando lo necesita","Como un subagente de diseño que se ocupa de todas las pantallas","Copiando todo el conocimiento de diseño dentro de CLAUDE.md","No hace falta darlo: el modelo ya sabe todo lo necesario de diseño"],
   e:"Un skill da el conocimiento sin traspasar contexto a otro agente, y no ocupa espacio mientras no se usa.", r:[13]},
  {s:4, q:"¿Por qué conviene que un subagente que planifica y evalúa tenga solo herramientas de lectura?",
   o:["Así no puede escribir: ni compite con quien programa ni toca lo que evalúa","Así consume menos tokens, porque las herramientas de edición son caras","Porque Claude Code no permite dar herramientas de edición a subagentes","Así trabaja más rápido, ya que tiene menos herramientas entre las que elegir"],

  {s:4, q:"Se combina un modelo potente y caro con otro más económico. ¿Qué reparto suele dar mejor resultado por su coste?",
   o:["El económico hace el trabajo y consulta al potente en las decisiones difíciles","El potente hace todo el trabajo y el económico revisa el resultado al final","Los dos resuelven la misma tarea por separado y se elige el mejor resultado","Cada uno se encarga de la mitad de los archivos que hay que modificar"],

  {s:4, q:"¿Por qué tiene sentido que un modelo potente planifique y evalúe, y que uno más económico programe?",

  {s:4, q:"Un agente pasa un plan a otro. ¿Cómo se reduce la información que se pierde en ese traspaso?",
   o:["Con un formato fijo: archivos, pasos, contratos y criterios de aceptación","Pidiendo al segundo agente que lea todo el historial del primero","Haciendo el plan lo más breve posible para que no se pierda nada","Dejando que el segundo agente complete por su cuenta lo que falte"],

  {s:4, q:"¿Cuándo está justificado mantener un subagente en lugar de integrar su trabajo en el agente principal con skills?",
   o:["Si hay exceso de contexto medible, tareas paralelas desechables o fallos con herramientas","Siempre que exista un rol distinto en el equipo humano que haría el trabajo","Cuando el prompt del agente principal supera las cien líneas de longitud","Cuando parte del trabajo se quiere hacer en un idioma distinto"],

  {s:4, q:"¿Para qué sirve un subagente de exploración de solo lectura?",
   o:["Buscar mucho en el código sin llenar el contexto del agente principal","Escribir código más rápido que el agente principal en tareas sencillas","Sustituir a los tests cuando el proyecto todavía no tiene ninguno","Guardar memoria del proyecto de una sesión de trabajo a la siguiente"],
   e:"Lee mucho en su propio contexto y devuelve solo lo relevante. Claude Code incluye uno, llamado Explore.", r:[21]},
  {s:5, q:"¿Por qué no basta con pedir al agente que programó que revise su propio trabajo?",
   o:["Tiende a valorar bien su trabajo aunque sea mediocre","No tiene permisos para leer el código que acaba de escribir","Revisar consume más tokens que volver a escribir el código","Los agentes que programan no pueden ejecutar tests después"],

  {s:5, q:"Si el evaluador es un agente distinto del que programó, ¿basta con eso para que la evaluación sea fiable?",
   o:["No: sin criterios concretos sigue tendiendo a ser indulgente","Sí: separar los agentes elimina cualquier sesgo de evaluación","Sí, siempre que el evaluador use el mismo modelo que el programador","No: la evaluación de código siempre la tiene que hacer una persona"],

  {s:5, q:"¿Qué es un criterio de aceptación comprobable?",
   o:["Uno que un test o una prueba puede responder con sí o no","Uno que el cliente ha aprobado por escrito antes de empezar","Uno redactado con lenguaje técnico y sin ambigüedades de estilo","Uno que describe paso a paso cómo se va a implementar la función"],

  {s:5, q:"Un verificador ejecuta dos tests, ambos pasan, y declara correcto el cambio. ¿Qué error ha cometido?",
   o:["Parar pronto: debía ejecutar la batería completa","Ninguno: si pasan los tests, el cambio es correcto","Ejecutar tests en vez de revisar el código leyéndolo","No pedir permiso al usuario antes de ejecutar los tests"],

  {s:5, q:"¿Qué es una prueba negativa?",

  {s:5, q:"¿Cuál es la señal más fiable para saber si un cambio funciona?",
   o:["Una comprobación que se ejecuta: tests, build o salidas esperadas","Que el agente asegure en su respuesta que lo ha comprobado","Que el código parezca correcto al leerlo con atención","Que no aparezcan mensajes de error en la conversación"],

  {s:5, q:"¿Cómo puede un agente evaluar con fiabilidad algo subjetivo, como la calidad del diseño de una interfaz?",

   e:"Criterios como claridad de las acciones principales o coherencia visual permiten evaluar y dan al que genera algo concreto que mejorar.", r:[7]},
  {s:6, q:"¿Qué diferencia hay entre una regla escrita en CLAUDE.md y un hook?",
   o:["El hook se ejecuta siempre; la regla depende de que el modelo la tenga en cuenta","Ninguna: Claude Code convierte cada regla de CLAUDE.md en un hook al arrancar","La regla tiene prioridad y se aplica antes que cualquier hook del proyecto","El hook solo sirve para dar formato al código, no para imponer normas"],

  {s:6, q:"¿Qué significa aplicar la idea del poka-yoke al trabajo con agentes?",
   o:["Diseñar para que el error no pueda cometerse o se detecte al instante","Revisar a mano cada cambio que haga el agente antes de aceptarlo","Repetir las instrucciones al agente hasta que deje de equivocarse","Anotar cada error en un documento para que el equipo no lo repita"],

  {s:6, q:"Para evitar que un error se repita, ¿qué orden de preferencia tiene sentido, de la protección más fuerte a la más débil?",
   o:["Rediseñar, restringir, automatizar con un test o hook y, al final, documentar","Documentar, automatizar con un test, restringir con tipos y, al final, rediseñar","Automatizar con un test primero y, solo si falla, rediseñar o documentar","Documentar el error y esperar a ver si se repite antes de cambiar nada"],

  {s:6, q:"Un hook de seguridad necesita Python y en el equipo no está instalado. ¿Qué comportamiento es más seguro?",
   o:["Bloquear la acción y avisar, en vez de dejarla pasar sin control","Dejar pasar la acción sin avisar, para no interrumpir el trabajo","Desactivar todos los hooks hasta que alguien instale Python","Instalar Python automáticamente sin preguntar al usuario"],

   o:["Un comando escrito de otra forma puede no coincidir con ningún patrón","Las expresiones regulares solo funcionan en Windows y no en Linux","Bloquea todos los comandos de git, también los que no son peligrosos","Necesita conexión a internet para descargar los patrones actualizados"],

  {s:6, q:"¿Por qué conviene impedir que el agente edite su propia configuración de hooks y permisos?",
   o:["Para que no pueda desactivar las protecciones que lo limitan","Porque esos archivos contienen las contraseñas del proyecto","Para que el agente trabaje más rápido al tener menos archivos","Porque Claude Code no puede leer esos archivos de configuración"],

  {s:7, q:"En el diseño por contrato, ¿quién es responsable de qué?",
   o:["Quien llama, las precondiciones; quien implementa, las postcondiciones","Quien implementa garantiza tanto las precondiciones como las postcondiciones","Quien llama garantiza tanto las precondiciones como las postcondiciones","Nadie en concreto: el contrato es solo documentación para orientarse"],
   e:"Que las obligaciones de cada parte estén explícitas evita suposiciones y permite comprobarlas.", r:[27]},
  {s:7, q:"¿Con qué criterio conviene dividir un sistema en módulos?",
   o:["Que cada módulo oculte una decisión de diseño que pueda cambiar","Que cada módulo corresponda a un paso del proceso de principio a fin","Que todos los módulos tengan aproximadamente el mismo tamaño","Que cada módulo lo desarrolle una persona distinta del equipo"],
   e:"Así una implementación puede sustituirse, por ejemplo cambiar un JSON por una base de datos, sin afectar a quien usa el módulo.", r:[28]},
  {s:7, q:"Dos partes de un sistema fallan porque cada una supone algo distinto de lo que hace la otra. ¿Qué práctica ataca directamente ese problema?",
   o:["Definir contratos ejecutables entre ellas: tipos, esquemas o tests","Añadir un tercer componente que vigile lo que hacen los otros dos","Escribir un README más detallado que explique cómo funciona cada una","Reunir con más frecuencia a los responsables de cada parte del sistema"],
   e:"Un contrato convierte las suposiciones en algo explícito y comprobable. Es también lo que más falla cuando dos agentes colaboran.", r:[27,17]},
  {s:7, q:"¿Qué ventaja tiene un contrato ejecutable frente a uno descrito solo en un documento?",
   o:["Se comprueba automáticamente, sin depender de que alguien lo recuerde","Ocupa menos espacio en el repositorio que un documento equivalente","Es más fácil de escribir y no hace falta mantenerlo cuando todo cambia","Ninguna: un documento bien escrito cumple exactamente la misma función"],
   e:"El documento puede completar al contrato, pero no sustituir la comprobación automática.", r:[27,0]},
  {s:8, q:"¿Por qué son especialmente útiles los registros de decisiones de arquitectura (ADR) cuando se trabaja con agentes?",
   o:["El agente empieza sin memoria, y el ADR le explica por qué se decidió algo","Los agentes no pueden leer código, así que necesitan las decisiones por escrito","Un ADR sustituye a los tests, porque documenta cómo debe comportarse el sistema","Claude Code exige al menos un ADR en el repositorio para poder arrancar"],
   e:"Un ADR guarda contexto, decisión y consecuencias junto al código.", r:[29]},
  {s:8, q:"La especificación, los ADR y CLAUDE.md son tres tipos de memoria del proyecto. ¿A qué pregunta responde cada uno?",
   o:["Qué debe hacer el proyecto / por qué está así / cómo se trabaja","Cómo se trabaja / qué debe hacer el proyecto / por qué está así","Por qué está así / cómo se trabaja / qué debe hacer el proyecto","Los tres responden a lo mismo, solo cambia el formato del documento"],
   e:"Separarlos permite leer cada uno solo cuando hace falta.", r:[0,29]},
  {s:8, q:"¿Cómo se decide si un cambio en la configuración de un agente (una regla, un skill, un subagente) mejora los resultados?",
   o:["Comparando tareas reales con y sin el cambio: éxito, coste y tiempo","Preguntando al propio agente si nota que ahora trabaja mejor","Adoptando directamente lo que recomiende el estudio más reciente","Probándolo en una tarea y decidiendo según cómo haya salido"],
   e:"Los estudios dan resultados distintos según el proyecto, así que cada cambio es una hipótesis hasta que se mide.", r:[10,13]},
  {s:8, q:"Al comparar dos configuraciones de un agente con las mismas tareas, ¿por qué conviene repetir cada ejecución varias veces?",
   o:["Los resultados de un agente varían de una ejecución a otra","Claude Code limita a tres el número de sesiones por proyecto","Así se gasta el mismo número de tokens en cada variante","Lo exigen los benchmarks públicos para publicar resultados"],
   e:"Con una sola ejecución, una diferencia puede deberse al azar.", r:[0]},
  {s:8, q:"Se quiere decidir si compensa usar un modelo potente como asesor de otro más económico. ¿Qué variantes conviene comparar?",
   o:["El económico solo, el económico con el potente de asesor, y el potente solo","Solo el modelo potente, que es el que marca el mejor resultado posible","Solo el modelo económico, que es el que finalmente se va a utilizar","Tres proveedores distintos, cada uno con su modelo más potente"],
   e:"Así se ve si el asesor mejora lo bastante como para justificar su coste, y si el modelo potente solo sería mejor.", r:[31]},
  {s:9, q:"Este subagente de Claude Code debe comprobar de forma independiente el trabajo del agente principal. Su definición tiene un fallo de diseño. ¿Cuál?",
   c:"---\nname: verificador\ndescription: Verifica los cambios antes de cerrar una tarea.\ntools: Read, Grep, Glob, Bash, Edit, Write\nmodel: inherit\n---",
   o:["Tiene `Edit` y `Write`: podría corregir lo que verifica","Le falta el campo `color`, que es obligatorio en todos los subagentes","Con `model: inherit` no puede ejecutar tests ni comandos de Bash","La descripción está en español y Claude Code no sabrá cuándo usarlo"],
   e:"Quitar las herramientas de edición convierte la independencia en una restricción técnica. El verificador describe los problemas y el agente principal los corrige. Un verificador con permisos de edición podría «arreglar» lo que comprueba, y su informe dejaría de ser independiente.", r:[0,7,21]},
  {s:9, q:"Un equipo organiza así sus subagentes, que se pasan el trabajo en cadena. ¿Cuál es el problema principal?",
   c:".claude/agents/\n├── planificador.md    # descompone la tarea en pasos\n├── programador.md     # implementa los pasos\n├── revisor.md         # revisa el código del programador\n└── documentador.md    # actualiza la documentación",
   o:["La información se degrada en cada traspaso de un agente al siguiente","Son pocos subagentes para cubrir todo el trabajo de un proyecto real","Faltan subagentes de seguridad y de rendimiento para estar completo","Los nombres de los archivos deberían estar en inglés para que funcionen"],
   e:"Cuatro agentes encadenados traspasan contexto tres veces, y la información se degrada en cada traspaso. Si se separa algo, conviene que sea un agente de solo lectura que planifique y evalúe con traspasos de formato fijo, mientras un único agente escribe. Documentar encaja mejor como skill.", r:[15,13,7]},
  {s:9, q:"¿Qué problema práctico tiene la descripción de este subagente de Claude Code?",
   c:"---\nname: ayudante\ndescription: Ayuda con varias cosas del proyecto.\ntools: Read, Grep, Glob\n---",
   o:["Claude decide cuándo delegar por la descripción, y esta no lo aclara","Las descripciones de más de 20 caracteres se recortan y se ignoran","Sin la herramienta `Bash` el subagente no puede arrancar en ningún caso","Ninguno: la descripción es solo documentación para las personas"],
   e:"La documentación recomienda descripciones específicas y orientadas a la acción, que digan qué hace y cuándo usarlo, como la del verificador de este repositorio.", r:[21,0]},
  {s:9, q:"Este hook de Claude Code, que se ejecuta antes de cada comando (PreToolUse), pretende bloquear `rm -rf /`. ¿Lo consigue?",
   c:"import json, sys\n\ndatos = json.load(sys.stdin)\ncomando = datos[\"tool_input\"][\"command\"]\nif \"rm -rf /\" in comando:\n    print(\"Comando peligroso\", file=sys.stderr)\n    sys.exit(1)\nsys.exit(0)",
   o:["No: solo el código 2 bloquea; con 1, el comando se ejecuta","Sí: cualquier código de salida distinto de 0 bloquea la acción","Sí, pero solo si el mensaje se escribe en stdout y no en stderr","No, porque un hook PreToolUse no puede leer el comando que se ejecutará"],
   e:"Es el error más habitual al escribir hooks: el convenio de Unix (1 = error) no bloquea nada en Claude Code. Los hooks del repositorio salen con 2. Con código 1 el error no es bloqueante y el comando se ejecuta.", r:[30,0]},
  {s:9, q:"Este hook de Claude Code bloquea un comando saliendo con código 2, pero Claude no entiende por qué se ha bloqueado. ¿Qué falla?",
   c:"if peligroso:\n    print(\"Bloqueado: pide autorización al usuario\")   # stdout\n    sys.exit(2)",
   o:["El motivo va a stdout, y Claude recibe el de stderr","Claude nunca recibe los mensajes de los hooks, solo el código","Falta un `return` antes de `sys.exit` para que el mensaje se envíe","El mensaje tiene que estar en inglés para que Claude lo interprete"],
   e:"Con código 2, Claude Code pasa a Claude el texto de stderr para que actúe en consecuencia. Por eso los hooks del repositorio usan `file=sys.stderr`.", r:[30,0]},
  {s:9, q:"Un hook Stop de Claude Code se ejecuta cuando Claude va a terminar su respuesta; si sale con código 2, le obliga a seguir trabajando. ¿Qué riesgo tiene este?",
   c:"# Hook Stop\ndatos = json.load(sys.stdin)\nr = subprocess.run([\"bash\", \"scripts/verificar.sh\"])\nif r.returncode != 0:\n    print(\"Los tests fallan\", file=sys.stderr)\n    sys.exit(2)",
   o:["Un bucle infinito: falta comprobar `stop_hook_active`","Ninguno: es la forma recomendada de escribir un hook Stop","Que se ejecute antes de cada comando y no al terminar la respuesta","Que borre los tests que fallan para poder terminar la tarea"],
   e:"`stop_hook_active` indica que Claude ya está continuando por un hook Stop. El hook del repositorio no vuelve a bloquear en ese caso y, además, solo verifica si hay cambios.", r:[30,0]},
  {s:9, q:"En Windows, Claude Code ejecuta los hooks con Git Bash. Con Python instalado desde python.org, este registro de hook puede dejar la protección desactivada sin aviso. ¿Por qué?",
   c:"\"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/.claude/hooks/bloquear-comandos.py\\\"\"",
   o:["`python3` suele ser el alias de la Store, que no ejecuta nada","Windows no admite hooks escritos en Python, solo en PowerShell","La variable `$CLAUDE_PROJECT_DIR` no existe en Windows","Los hooks de Claude Code solo se ejecutan en Linux y macOS"],
   e:"Por eso el repositorio lanza los hooks con `ejecutar.sh`, que busca un Python que funcione y, si no encuentra ninguno, bloquea en lugar de dejar pasar. Ese fallo no es bloqueante, así que el comando pasaría sin ninguna comprobación.", r:[0]},
  {s:9, q:"Un hook usa esta expresión regular para bloquear los `git push` forzados. ¿Cuál de estos comandos deja pasar?",
   c:"(r\"\\bgit\\s+push\\b.*\\s(--force(?!-with-lease)|-f)\\b\", \"git push forzado\")",

   e:"`(?!-with-lease)` es una búsqueda negativa: `--force` solo coincide si no le sigue `-with-lease`, la variante que no pisa cambios ajenos.", r:[0]},
  {s:9, q:"Un hook de Claude Code impide al agente editar los archivos de esta lista. ¿Por qué incluye `.claude/settings.json` y `.claude/hooks/`, que no contienen secretos?",
   c:"PROTEGIDOS = [\".env\", \".env.*\", \"*.pem\", \"*.key\", \"secrets/*\", \".git/*\",\n              \".claude/settings.json\", \".claude/hooks/*\"]",

   e:"Una protección que el agente puede desmontar no protege. Los cambios en la configuración de seguridad los hace el usuario.", r:[0]},
  {s:9, q:"¿Qué consigue esta parte del archivo de configuración `.claude/settings.json` de Claude Code?",

   o:["Impide que Claude Code lea esos archivos, aunque el agente lo intente","Cifra los archivos `.env` para que nadie pueda leerlos sin la clave","Borra los archivos de secretos al cerrar la sesión de Claude Code","Oculta esos archivos al usuario en el explorador de archivos"],

  {s:9, q:"Este tipo permite un simulador «publicado» sin fecha de publicación. ¿Qué cambio hace irrepresentable ese estado?",
   c:"interface Simulador {\n  nombre: string;\n  estado: \"borrador\" | \"publicado\";\n  fechaPublicacion?: Date;\n}",
   o:["Una unión discriminada: `{ estado: \"borrador\" } | { estado: \"publicado\"; fechaPublicacion: Date }`","Añadir el comentario `// si está publicado, rellenar fechaPublicacion` junto al campo","Cambiar `fechaPublicacion?: Date` por `fechaPublicacion: Date | null` en la interfaz","Validar en el formulario de la interfaz que la fecha esté rellena antes de guardar"],
   e:"Con la unión discriminada, el compilador exige la fecha cuando el estado es «publicado»: el estado inválido no se puede ni escribir.", r:[26]},
  {s:9, q:"Alguien llama a `media([])` y el programa falla con `ZeroDivisionError`. Según el diseño por contrato, ¿quién ha incumplido el contrato?",
   c:"def media(valores: list[float]) -> float:\n    \"\"\"Precondición: valores no está vacía.\n    Postcondición: min(valores) <= resultado <= max(valores).\"\"\"\n    return sum(valores) / len(valores)",
   o:["Quien llama: no garantizó la precondición","La función `media`: debía aceptar cualquier lista","Nadie: es un fallo del propio lenguaje","El test, porque no cubría el caso de lista vacía"],
   e:"Quien llama garantiza las precondiciones y quien implementa, las postcondiciones. Para que sea ejecutable, la precondición puede comprobarse con una aserción.", r:[27]},
  {s:9, q:"¿Qué aporta definir así la ficha de un simulador, frente a describirla solo en un documento Markdown?",
   c:"{\n  \"type\": \"object\",\n  \"required\": [\"nombre\", \"version\", \"url_descarga\"],\n  \"properties\": {\n    \"nombre\":       { \"type\": \"string\", \"minLength\": 1 },\n    \"version\":      { \"type\": \"string\", \"pattern\": \"^[0-9]+[.][0-9]+[.][0-9]+$\" },\n    \"url_descarga\": { \"type\": \"string\", \"format\": \"uri\" }\n  }\n}",

const LET = ["A","B","C","D"];
const KEY = "autoeval-agentes-v5";
let state = { filter: -1, order: [], i: 0, answers: {}, shuffles: {}, review: false };

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.order && s.order.length) state = s; } catch (e) {}
}
function buildOrder() {
  let ids = Q.map((_, k) => k);
  if (state.filter >= 0) ids = ids.filter(k => Q[k].s === state.filter);
  if (state.review) ids = ids.filter(k => state.answers[k] !== undefined && state.answers[k] !== 0);
  state.order = ids; state.i = 0;
}
function perm(k) {
  if (!state.shuffles[k]) state.shuffles[k] = shuffle([0,1,2,3]);
  return state.shuffles[k];
}
function esc(t) { return t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Texto con `código` en línea
function fmt(t) { return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>"); }

function refsHtml(r) {
  return r.map(n => {
    const [t, u] = REFS[n];
    const label = n === 0 ? t : "[" + n + "] " + t;
    return u ? '<a href="' + u + '" target="_blank" rel="noopener">' + esc(label) + "</a>" : esc(label);
  }).join(" · ");
}

function renderChips() {
  const box = document.getElementById("chips");
  const all = [["Todas", -1]].concat(SECTIONS.map((s, k) => [s, k]));
  box.innerHTML = all.map(([t, k]) =>
    '<button class="chip" data-k="' + k + '" aria-pressed="' + (state.filter === k && !state.review) + '">' + esc(t) + "</button>").join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    state.filter = +b.dataset.k; state.review = false; buildOrder(); save(); render();
  });
}

function stats(ids) {
  let ok = 0, done = 0;
  ids.forEach(k => { if (state.answers[k] !== undefined) { done++; if (state.answers[k] === 0) ok++; } });
  return { ok, done, total: ids.length };
}

function render() {
  renderChips();
  const view = document.getElementById("view");
  const st = stats(state.order);
  document.getElementById("bar").style.width = (st.total ? st.done / st.total * 100 : 0) + "%";
  document.getElementById("score").textContent = st.ok + " aciertos de " + st.done + " respondidas";

  if (!state.order.length) {
    document.getElementById("pos").textContent = "";
    view.innerHTML = '<p>No hay preguntas falladas que repasar.</p><div class="nav"><span></span><button class="btn" id="back">Volver al test</button></div>';
    document.getElementById("back").onclick = () => { state.review = false; buildOrder(); save(); render(); };
    return;
  }
  if (state.i >= state.order.length) return renderSummary();

  const k = state.order[state.i], q = Q[k], p = perm(k), ans = state.answers[k];
  document.getElementById("pos").textContent = (state.review ? "Repaso · " : "") + "Pregunta " + (state.i + 1) + " de " + state.order.length;

  let h = '<div class="section">' + esc(SECTIONS[q.s]) + '</div><div class="q">' + fmt(q.q) + '</div>' + (q.c ? '<pre class="code">' + esc(q.c) + '</pre>' : '') + '<div class="opts">';
  p.forEach((oi, pos) => {
    let cls = "opt";
    if (ans !== undefined) { if (oi === 0) cls += " ok"; else if (oi === ans) cls += " ko"; }
    h += '<button class="' + cls + '" data-oi="' + oi + '"' + (ans !== undefined ? " disabled" : "") + '><span class="k">' + LET[pos] + "</span><span>" + fmt(q.o[oi]) + "</span></button>";
  });
  h += "</div>";
  if (ans !== undefined) {
    const good = ans === 0;
    h += '<div class="fb show ' + (good ? "ok" : "ko") + '"><strong>' + (good ? "Correcto." : "No es esa. La respuesta correcta es la marcada en verde.") + "</strong>" +
         fmt(q.e) + '<div class="ref">Fuente: ' + refsHtml(q.r) + "</div></div>";
  }
  h += '<div class="nav"><button class="btn ghost" id="prev"' + (state.i === 0 ? " disabled" : "") + '>← Anterior</button>' +
       '<button class="btn" id="next"' + (ans === undefined ? " disabled" : "") + ">" + (state.i === state.order.length - 1 ? "Ver resultado" : "Siguiente →") + "</button></div>";
  view.innerHTML = h;

  view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.oi));
  document.getElementById("prev").onclick = () => { state.i--; save(); render(); };
  document.getElementById("next").onclick = next;
}

function answer(oi) {
  const k = state.order[state.i];
  if (state.answers[k] !== undefined && !state.review) return;
  state.answers[k] = oi; save(); render();
  const n = document.getElementById("next"); if (n) n.focus();
}
function next() {
  const k = state.order[state.i];
  if (state.answers[k] === undefined) return;
  state.i++; save(); render();
}

function renderSummary() {
  const view = document.getElementById("view");
  document.getElementById("pos").textContent = "Resultado";
  const st = stats(state.order);
  const pct = st.total ? Math.round(st.ok / st.total * 100) : 0;
  let rows = "";
  SECTIONS.forEach((s, si) => {
    const ids = state.order.filter(k => Q[k].s === si);
    if (!ids.length) return;
    const x = stats(ids);
    rows += "<tr><td>" + esc(s) + '</td><td class="n">' + x.ok + " / " + x.total + "</td></tr>";
  });
  const fails = Q.map((_, k) => k).filter(k => state.answers[k] !== undefined && state.answers[k] !== 0).length;
  view.innerHTML =
    '<div class="section">Resultado</div><div class="big">' + st.ok + " / " + st.total + " (" + pct + " %)</div>" +
    "<table><thead><tr><th>Bloque</th><th class=\"n\">Aciertos</th></tr></thead><tbody>" + rows + "</tbody></table>" +
    '<div class="nav"><button class="btn ghost" id="restart">Empezar de nuevo</button>' +
    '<button class="btn" id="review"' + (fails ? "" : " disabled") + ">Repasar falladas (" + fails + ")</button></div>";
  document.getElementById("restart").onclick = () => {
    state = { filter: state.filter, order: [], i: 0, answers: {}, shuffles: {}, review: false };
    buildOrder(); save(); render();
  };
  document.getElementById("review").onclick = () => {
    const wrong = Q.map((_, k) => k).filter(k => state.answers[k] !== undefined && state.answers[k] !== 0);
    wrong.forEach(k => { delete state.answers[k]; delete state.shuffles[k]; });
    state.review = true; state.filter = -1; state.order = wrong; state.i = 0; save(); render();
  };
}

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("a")) return;
  if (["1","2","3","4"].includes(e.key)) {
    const b = document.querySelectorAll(".opt")[+e.key - 1];
    if (b && !b.disabled) b.click();
  } else if (e.key === "Enter" || e.key === "ArrowRight") {
    const n = document.getElementById("next"); if (n && !n.disabled) { e.preventDefault(); n.click(); }
  } else if (e.key === "ArrowLeft") {
    const p = document.getElementById("prev"); if (p && !p.disabled) p.click();
  }
});

load();
if (!state.order.length) buildOrder();
render();
</script>
