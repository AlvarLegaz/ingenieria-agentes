  {s:2, q:"¿Por qué tiene sentido que un modelo potente planifique y evalúe, y que uno más económico programe?",

  {s:2, q:"¿Cuándo está justificado mantener un subagente en lugar de integrar su trabajo en el agente principal con skills?",

  {s:2, q:"¿Para qué sirve un subagente de exploración de solo lectura?",

  {s:3, q:"Si el evaluador es un agente distinto del que programó, ¿basta con eso para que la evaluación sea fiable?",

  {s:3, q:"¿Qué es un criterio de aceptación comprobable?",
   o:["Uno que un test o una prueba puede responder con sí o no","Uno que el cliente ha aprobado por escrito antes de empezar","Uno redactado con lenguaje técnico y sin ambigüedades de estilo","Uno que describe paso a paso cómo se va a implementar la función"],

   o:["Parar pronto: debía ejecutar la batería completa","Ninguno: si pasan los tests, el cambio es correcto","Ejecutar tests en vez de revisar el código leyéndolo","No pedir permiso al usuario antes de ejecutar los tests"],

  {s:3, q:"¿Qué es una prueba negativa?",

  {s:3, q:"¿Cuál es la señal más fiable para saber si un cambio funciona?",

  {s:4, q:"¿Qué diferencia hay entre una regla escrita en CLAUDE.md y un hook?",
   o:["El hook se ejecuta siempre; la regla depende de que el modelo la tenga en cuenta","Ninguna: Claude Code convierte cada regla de CLAUDE.md en un hook al arrancar","La regla tiene prioridad y se aplica antes que cualquier hook del proyecto","El hook solo sirve para dar formato al código, no para imponer normas"],

  {s:4, q:"¿Qué significa aplicar la idea del poka-yoke al trabajo con agentes?",
   o:["Diseñar para que el error no pueda cometerse o se detecte al instante","Revisar a mano cada cambio que haga el agente antes de aceptarlo","Repetir las instrucciones al agente hasta que deje de equivocarse","Anotar cada error en un documento para que el equipo no lo repita"],

  {s:4, q:"Un hook de seguridad necesita Python y en el equipo no está instalado. ¿Qué comportamiento es más seguro?",
   o:["Bloquear la acción y avisar, en vez de dejarla pasar sin control","Dejar pasar la acción sin avisar, para no interrumpir el trabajo","Desactivar todos los hooks hasta que alguien instale Python","Instalar Python automáticamente sin preguntar al usuario"],

  {s:4, q:"¿Por qué conviene impedir que el agente edite su propia configuración de hooks y permisos?",

  {s:5, q:"En el diseño por contrato, ¿quién es responsable de qué?",
   o:["Quien llama, las precondiciones; quien implementa, las postcondiciones","Quien implementa garantiza tanto las precondiciones como las postcondiciones","Quien llama garantiza tanto las precondiciones como las postcondiciones","Nadie en concreto: el contrato es solo documentación para orientarse"],

  {s:5, q:"¿Con qué criterio conviene dividir un sistema en módulos?",

   e:"Así una implementación puede sustituirse, por ejemplo cambiar un JSON por una base de datos, sin afectar a quien usa el módulo.", r:[28]},
  {s:5, q:"Dos partes de un sistema fallan porque cada una supone algo distinto de lo que hace la otra. ¿Qué práctica ataca directamente ese problema?",
   o:["Definir contratos ejecutables entre ellas: tipos, esquemas o tests","Añadir un tercer componente que vigile lo que hacen los otros dos","Escribir un README más detallado que explique cómo funciona cada una","Reunir con más frecuencia a los responsables de cada parte del sistema"],

  {s:5, q:"¿Qué ventaja tiene un contrato ejecutable frente a uno descrito solo en un documento?",
   o:["Se comprueba automáticamente, sin depender de que alguien lo recuerde","Ocupa menos espacio en el repositorio que un documento equivalente","Es más fácil de escribir y no hace falta mantenerlo cuando todo cambia","Ninguna: un documento bien escrito cumple exactamente la misma función"],
   e:"El documento puede completar al contrato, pero no sustituir la comprobación automática.", r:[27,0]},
  {s:6, q:"¿Por qué son especialmente útiles los registros de decisiones de arquitectura (ADR) cuando se trabaja con agentes?",
   o:["El agente empieza sin memoria, y el ADR le explica por qué se decidió algo","Los agentes no pueden leer código, así que necesitan las decisiones por escrito","Un ADR sustituye a los tests, porque documenta cómo debe comportarse el sistema","Claude Code exige al menos un ADR en el repositorio para poder arrancar"],

  {s:6, q:"La especificación, los ADR y CLAUDE.md son tres tipos de memoria del proyecto. ¿A qué pregunta responde cada uno?",
   o:["Qué debe hacer el proyecto / por qué está así / cómo se trabaja","Cómo se trabaja / qué debe hacer el proyecto / por qué está así","Por qué está así / cómo se trabaja / qué debe hacer el proyecto","Los tres responden a lo mismo, solo cambia el formato del documento"],

  {s:6, q:"¿Cómo se decide si un cambio en la configuración de un agente (una regla, un skill, un subagente) mejora los resultados?",
   o:["Comparando tareas reales con y sin el cambio: éxito, coste y tiempo","Preguntando al propio agente si nota que ahora trabaja mejor","Adoptando directamente lo que recomiende el estudio más reciente","Probándolo en una tarea y decidiendo según cómo haya salido"],

  {s:6, q:"Al comparar dos configuraciones de un agente con las mismas tareas, ¿por qué conviene repetir cada ejecución varias veces?",
   o:["Los resultados de un agente varían de una ejecución a otra","Claude Code limita a tres el número de sesiones por proyecto","Así se gasta el mismo número de tokens en cada variante","Lo exigen los benchmarks públicos para publicar resultados"],

  {s:6, q:"Se quiere decidir si compensa usar un modelo potente como asesor de otro más económico. ¿Qué variantes conviene comparar?",
   o:["El económico solo, el económico con el potente de asesor, y el potente solo","Solo el modelo potente, que es el que marca el mejor resultado posible","Solo el modelo económico, que es el que finalmente se va a utilizar","Tres proveedores distintos, cada uno con su modelo más potente"],

  {s:7, q:"Este subagente de Claude Code debe comprobar de forma independiente el trabajo del agente principal. Su definición tiene un fallo de diseño. ¿Cuál?",
   c:"---\nname: verificador\ndescription: Verifica los cambios antes de cerrar una tarea.\ntools: Read, Grep, Glob, Bash, Edit, Write\nmodel: inherit\n---",
   o:["Tiene `Edit` y `Write`: podría corregir lo que verifica","Le falta el campo `color`, que es obligatorio en todos los subagentes","Con `model: inherit` no puede ejecutar tests ni comandos de Bash","La descripción está en español y Claude Code no sabrá cuándo usarlo"],
   e:"Quitar las herramientas de edición convierte la independencia en una restricción técnica. El verificador describe los problemas y el agente principal los corrige. Un verificador con permisos de edición podría «arreglar» lo que comprueba, y su informe dejaría de ser independiente.", r:[0,7,21]},
  {s:7, q:"Un equipo organiza así sus subagentes, que se pasan el trabajo en cadena. ¿Cuál es el problema principal?",
   c:".claude/agents/\n├── planificador.md    # descompone la tarea en pasos\n├── programador.md     # implementa los pasos\n├── revisor.md         # revisa el código del programador\n└── documentador.md    # actualiza la documentación",
   o:["La información se degrada en cada traspaso de un agente al siguiente","Son pocos subagentes para cubrir todo el trabajo de un proyecto real","Faltan subagentes de seguridad y de rendimiento para estar completo","Los nombres de los archivos deberían estar en inglés para que funcionen"],
   e:"Cuatro agentes encadenados traspasan contexto tres veces, y la información se degrada en cada traspaso. Si se separa algo, conviene que sea un agente de solo lectura que planifique y evalúe con traspasos de formato fijo, mientras un único agente escribe. Documentar encaja mejor como skill.", r:[15,13,7]},
  {s:7, q:"¿Qué problema práctico tiene la descripción de este subagente de Claude Code?",
   c:"---\nname: ayudante\ndescription: Ayuda con varias cosas del proyecto.\ntools: Read, Grep, Glob\n---",
   o:["Claude decide cuándo delegar por la descripción, y esta no lo aclara","Las descripciones de más de 20 caracteres se recortan y se ignoran","Sin la herramienta `Bash` el subagente no puede arrancar en ningún caso","Ninguno: la descripción es solo documentación para las personas"],
   e:"La documentación recomienda descripciones específicas y orientadas a la acción, que digan qué hace y cuándo usarlo, como la del verificador de este repositorio.", r:[21,0]},
  {s:7, q:"Este hook de Claude Code, que se ejecuta antes de cada comando (PreToolUse), pretende bloquear `rm -rf /`. ¿Lo consigue?",
   c:"import json, sys\n\ndatos = json.load(sys.stdin)\ncomando = datos[\"tool_input\"][\"command\"]\nif \"rm -rf /\" in comando:\n    print(\"Comando peligroso\", file=sys.stderr)\n    sys.exit(1)\nsys.exit(0)",
   o:["No: solo el código 2 bloquea; con 1, el comando se ejecuta","Sí: cualquier código de salida distinto de 0 bloquea la acción","Sí, pero solo si el mensaje se escribe en stdout y no en stderr","No, porque un hook PreToolUse no puede leer el comando que se ejecutará"],
   e:"Es el error más habitual al escribir hooks: el convenio de Unix (1 = error) no bloquea nada en Claude Code. Los hooks del repositorio salen con 2. Con código 1 el error no es bloqueante y el comando se ejecuta.", r:[30,0]},
  {s:7, q:"Este hook de Claude Code bloquea un comando saliendo con código 2, pero Claude no entiende por qué se ha bloqueado. ¿Qué falla?",
   c:"if peligroso:\n    print(\"Bloqueado: pide autorización al usuario\")   # stdout\n    sys.exit(2)",
   o:["El motivo va a stdout, y Claude recibe el de stderr","Claude nunca recibe los mensajes de los hooks, solo el código","Falta un `return` antes de `sys.exit` para que el mensaje se envíe","El mensaje tiene que estar en inglés para que Claude lo interprete"],
   e:"Con código 2, Claude Code pasa a Claude el texto de stderr para que actúe en consecuencia. Por eso los hooks del repositorio usan `file=sys.stderr`.", r:[30,0]},
  {s:7, q:"Un hook Stop de Claude Code se ejecuta cuando Claude va a terminar su respuesta; si sale con código 2, le obliga a seguir trabajando. ¿Qué riesgo tiene este?",
   c:"# Hook Stop\ndatos = json.load(sys.stdin)\nr = subprocess.run([\"bash\", \"scripts/verificar.sh\"])\nif r.returncode != 0:\n    print(\"Los tests fallan\", file=sys.stderr)\n    sys.exit(2)",
   o:["Un bucle infinito: falta comprobar `stop_hook_active`","Ninguno: es la forma recomendada de escribir un hook Stop","Que se ejecute antes de cada comando y no al terminar la respuesta","Que borre los tests que fallan para poder terminar la tarea"],
   e:"`stop_hook_active` indica que Claude ya está continuando por un hook Stop. El hook del repositorio no vuelve a bloquear en ese caso y, además, solo verifica si hay cambios.", r:[30,0]},
  {s:7, q:"En Windows, Claude Code ejecuta los hooks con Git Bash. Con Python instalado desde python.org, este registro de hook puede dejar la protección desactivada sin aviso. ¿Por qué?",
   c:"\"command\": \"python3 \\\"$CLAUDE_PROJECT_DIR/.claude/hooks/bloquear-comandos.py\\\"\"",

  {s:7, q:"Un hook usa esta expresión regular para bloquear los `git push` forzados. ¿Cuál de estos comandos deja pasar?",

  {s:7, q:"Este tipo permite un simulador «publicado» sin fecha de publicación. ¿Qué cambio hace irrepresentable ese estado?",

  {s:7, q:"Alguien llama a `media([])` y el programa falla con `ZeroDivisionError`. Según el diseño por contrato, ¿quién ha incumplido el contrato?",

   e:"Un contrato ejecutable detecta los incumplimientos sin depender de que alguien lea y recuerde un documento. El documento solo debería recoger lo que el esquema no puede expresar.", r:[0,27]},
  {s:7, q:"El catálogo guarda hoy los simuladores en un JSON, pero mañana podría usar una base de datos. Siguiendo el principio de ocultación de información, ¿qué interfaz debe ofrecer el módulo de catálogo al resto de la web?",

  {s:7, q:"¿Qué conviene hacer con esta sección de un CLAUDE.md, y por qué?",

const LET = ["A","B","C","D"];
const KEY = "autoeval-agentes-v4";
let state = { filter: -1, order: [], i: 0, answers: {}, shuffles: {}, review: false };

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.order && s.order.length) state = s; } catch (e) {}
}
function buildOrder() {
  let ids = Q.map((_, k) => k);
  if (state.filter >= 0) ids = ids.filter(k => Q[k].s === state.filter);
  if (state.review) ids = ids.filter(k => state.answers[k] !== undefined && state.answers[k] !== 0);
  state.order = ids; state.i = 0;
}
function perm(k) {
  if (!state.shuffles[k]) state.shuffles[k] = shuffle([0,1,2,3]);
  return state.shuffles[k];
}
function esc(t) { return t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Texto con `código` en línea
function fmt(t) { return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>"); }

function refsHtml(r) {
  return r.map(n => {
    const [t, u] = REFS[n];
    const label = n === 0 ? t : "[" + n + "] " + t;
    return u ? '<a href="' + u + '" target="_blank" rel="noopener">' + esc(label) + "</a>" : esc(label);
  }).join(" · ");
}

function renderChips() {
  const box = document.getElementById("chips");
  const all = [["Todas", -1]].concat(SECTIONS.map((s, k) => [s, k]));
  box.innerHTML = all.map(([t, k]) =>
    '<button class="chip" data-k="' + k + '" aria-pressed="' + (state.filter === k && !state.review) + '">' + esc(t) + "</button>").join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    state.filter = +b.dataset.k; state.review = false; buildOrder(); save(); render();
  });
}

function stats(ids) {
  let ok = 0, done = 0;
  ids.forEach(k => { if (state.answers[k] !== undefined) { done++; if (state.answers[k] === 0) ok++; } });
  return { ok, done, total: ids.length };
}

function render() {
  renderChips();
  const view = document.getElementById("view");
  const st = stats(state.order);
  document.getElementById("bar").style.width = (st.total ? st.done / st.total * 100 : 0) + "%";
  document.getElementById("score").textContent = st.ok + " aciertos de " + st.done + " respondidas";

  if (!state.order.length) {
    document.getElementById("pos").textContent = "";
    view.innerHTML = '<p>No hay preguntas falladas que repasar.</p><div class="nav"><span></span><button class="btn" id="back">Volver al test</button></div>';
    document.getElementById("back").onclick = () => { state.review = false; buildOrder(); save(); render(); };
    return;
  }
  if (state.i >= state.order.length) return renderSummary();

  const k = state.order[state.i], q = Q[k], p = perm(k), ans = state.answers[k];
  document.getElementById("pos").textContent = (state.review ? "Repaso · " : "") + "Pregunta " + (state.i + 1) + " de " + state.order.length;

  let h = '<div class="section">' + esc(SECTIONS[q.s]) + '</div><div class="q">' + fmt(q.q) + '</div>' + (q.c ? '<pre class="code">' + esc(q.c) + '</pre>' : '') + '<div class="opts">';
  p.forEach((oi, pos) => {
    let cls = "opt";
    if (ans !== undefined) { if (oi === 0) cls += " ok"; else if (oi === ans) cls += " ko"; }
    h += '<button class="' + cls + '" data-oi="' + oi + '"' + (ans !== undefined ? " disabled" : "") + '><span class="k">' + LET[pos] + "</span><span>" + fmt(q.o[oi]) + "</span></button>";
  });
  h += "</div>";
  if (ans !== undefined) {
    const good = ans === 0;
    h += '<div class="fb show ' + (good ? "ok" : "ko") + '"><strong>' + (good ? "Correcto." : "No es esa. La respuesta correcta es la marcada en verde.") + "</strong>" +
         fmt(q.e) + '<div class="ref">Fuente: ' + refsHtml(q.r) + "</div></div>";
  }
  h += '<div class="nav"><button class="btn ghost" id="prev"' + (state.i === 0 ? " disabled" : "") + '>← Anterior</button>' +
       '<button class="btn" id="next"' + (ans === undefined ? " disabled" : "") + ">" + (state.i === state.order.length - 1 ? "Ver resultado" : "Siguiente →") + "</button></div>";
  view.innerHTML = h;

  view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.oi));
  document.getElementById("prev").onclick = () => { state.i--; save(); render(); };
  document.getElementById("next").onclick = next;
}

function answer(oi) {
  const k = state.order[state.i];
  if (state.answers[k] !== undefined && !state.review) return;
  state.answers[k] = oi; save(); render();
  const n = document.getElementById("next"); if (n) n.focus();
}
function next() {
  const k = state.order[state.i];
  if (state.answers[k] === undefined) return;
  state.i++; save(); render();
}

function renderSummary() {
  const view = document.getElementById("view");
  document.getElementById("pos").textContent = "Resultado";
  const st = stats(state.order);
  const pct = st.total ? Math.round(st.ok / st.total * 100) : 0;
  let rows = "";
  SECTIONS.forEach((s, si) => {
    const ids = state.order.filter(k => Q[k].s === si);
    if (!ids.length) return;
    const x = stats(ids);
    rows += "<tr><td>" + esc(s) + '</td><td class="n">' + x.ok + " / " + x.total + "</td></tr>";
  });
  const fails = Q.map((_, k) => k).filter(k => state.answers[k] !== undefined && state.answers[k] !== 0).length;
  view.innerHTML =
    '<div class="section">Resultado</div><div class="big">' + st.ok + " / " + st.total + " (" + pct + " %)</div>" +
    "<table><thead><tr><th>Bloque</th><th class=\"n\">Aciertos</th></tr></thead><tbody>" + rows + "</tbody></table>" +
    '<div class="nav"><button class="btn ghost" id="restart">Empezar de nuevo</button>' +
    '<button class="btn" id="review"' + (fails ? "" : " disabled") + ">Repasar falladas (" + fails + ")</button></div>";
  document.getElementById("restart").onclick = () => {
    state = { filter: state.filter, order: [], i: 0, answers: {}, shuffles: {}, review: false };
    buildOrder(); save(); render();
  };
  document.getElementById("review").onclick = () => {
    const wrong = Q.map((_, k) => k).filter(k => state.answers[k] !== undefined && state.answers[k] !== 0);
    wrong.forEach(k => { delete state.answers[k]; delete state.shuffles[k]; });
    state.review = true; state.filter = -1; state.order = wrong; state.i = 0; save(); render();
  };
}

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("a")) return;
  if (["1","2","3","4"].includes(e.key)) {
    const b = document.querySelectorAll(".opt")[+e.key - 1];
    if (b && !b.disabled) b.click();
  } else if (e.key === "Enter" || e.key === "ArrowRight") {
    const n = document.getElementById("next"); if (n && !n.disabled) { e.preventDefault(); n.click(); }
  } else if (e.key === "ArrowLeft") {
    const p = document.getElementById("prev"); if (p && !p.disabled) p.click();
  }
});

load();
if (!state.order.length) buildOrder();
render();
</script>
</body>
