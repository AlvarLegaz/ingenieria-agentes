const LET = ["A","B","C","D"];
const KEY = "autoeval-agentes-v3";
let state = { filter: -1, order: [], i: 0, answers: {}, shuffles: {}, review: false };

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.order && s.order.length) state = s; } catch (e) {}
}
function buildOrder() {
  let ids = Q.map((_, k) => k);
  if (state.filter >= 0) ids = ids.filter(k => Q[k].s === state.filter);
  if (state.review) ids = ids.filter(k => state.answers[k] !== undefined && state.answers[k] !== 0);
  state.order = ids; state.i = 0;
}
function perm(k) {
  if (!state.shuffles[k]) state.shuffles[k] = shuffle([0,1,2,3]);
  return state.shuffles[k];
}
function esc(t) { return t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
// Texto con `código` en línea
function fmt(t) { return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>"); }

function refsHtml(r) {
  return r.map(n => {
    const [t, u] = REFS[n];
    const label = n === 0 ? t : "[" + n + "] " + t;
    return u ? '<a href="' + u + '" target="_blank" rel="noopener">' + esc(label) + "</a>" : esc(label);
  }).join(" · ");
}

function renderChips() {
  const box = document.getElementById("chips");
  const all = [["Todas", -1]].concat(SECTIONS.map((s, k) => [s, k]));
  box.innerHTML = all.map(([t, k]) =>
    '<button class="chip" data-k="' + k + '" aria-pressed="' + (state.filter === k && !state.review) + '">' + esc(t) + "</button>").join("");
  box.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    state.filter = +b.dataset.k; state.review = false; buildOrder(); save(); render();
  });
}

function stats(ids) {
  let ok = 0, done = 0;
  ids.forEach(k => { if (state.answers[k] !== undefined) { done++; if (state.answers[k] === 0) ok++; } });
  return { ok, done, total: ids.length };
}

function render() {
  renderChips();
  const view = document.getElementById("view");
  const st = stats(state.order);
  document.getElementById("bar").style.width = (st.total ? st.done / st.total * 100 : 0) + "%";
  document.getElementById("score").textContent = st.ok + " aciertos de " + st.done + " respondidas";

  if (!state.order.length) {
    document.getElementById("pos").textContent = "";
    view.innerHTML = '<p>No hay preguntas falladas que repasar.</p><div class="nav"><span></span><button class="btn" id="back">Volver al test</button></div>';
    document.getElementById("back").onclick = () => { state.review = false; buildOrder(); save(); render(); };
    return;
  }
  if (state.i >= state.order.length) return renderSummary();

  const k = state.order[state.i], q = Q[k], p = perm(k), ans = state.answers[k];
  document.getElementById("pos").textContent = (state.review ? "Repaso · " : "") + "Pregunta " + (state.i + 1) + " de " + state.order.length;

  let h = '<div class="section">' + esc(SECTIONS[q.s]) + '</div><div class="q">' + fmt(q.q) + '</div>' + (q.c ? '<pre class="code">' + esc(q.c) + '</pre>' : '') + '<div class="opts">';
  p.forEach((oi, pos) => {
    let cls = "opt";
    if (ans !== undefined) { if (oi === 0) cls += " ok"; else if (oi === ans) cls += " ko"; }
    h += '<button class="' + cls + '" data-oi="' + oi + '"' + (ans !== undefined ? " disabled" : "") + '><span class="k">' + LET[pos] + "</span><span>" + fmt(q.o[oi]) + "</span></button>";
  });
  h += "</div>";
  if (ans !== undefined) {
    const good = ans === 0;
    h += '<div class="fb show ' + (good ? "ok" : "ko") + '"><strong>' + (good ? "Correcto." : "No es esa. La respuesta correcta es la marcada en verde.") + "</strong>" +
         fmt(q.e) + '<div class="ref">Fuente: ' + refsHtml(q.r) + "</div></div>";
  }
  h += '<div class="nav"><button class="btn ghost" id="prev"' + (state.i === 0 ? " disabled" : "") + '>← Anterior</button>' +
       '<button class="btn" id="next"' + (ans === undefined ? " disabled" : "") + ">" + (state.i === state.order.length - 1 ? "Ver resultado" : "Siguiente →") + "</button></div>";
  view.innerHTML = h;

  view.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.oi));
  document.getElementById("prev").onclick = () => { state.i--; save(); render(); };
  document.getElementById("next").onclick = next;
}

function answer(oi) {
  const k = state.order[state.i];
  if (state.answers[k] !== undefined && !state.review) return;
  state.answers[k] = oi; save(); render();
  const n = document.getElementById("next"); if (n) n.focus();
}
function next() {
  const k = state.order[state.i];
  if (state.answers[k] === undefined) return;
  state.i++; save(); render();
}

function renderSummary() {
  const view = document.getElementById("view");
  document.getElementById("pos").textContent = "Resultado";
  const st = stats(state.order);
  const pct = st.total ? Math.round(st.ok / st.total * 100) : 0;
  let rows = "";
  SECTIONS.forEach((s, si) => {
    const ids = state.order.filter(k => Q[k].s === si);
    if (!ids.length) return;
    const x = stats(ids);
    rows += "<tr><td>" + esc(s) + '</td><td class="n">' + x.ok + " / " + x.total + "</td></tr>";
  });
  const fails = Q.map((_, k) => k).filter(k => state.answers[k] !== undefined && state.answers[k] !== 0).length;
  view.innerHTML =
    '<div class="section">Resultado</div><div class="big">' + st.ok + " / " + st.total + " (" + pct + " %)</div>" +
    "<table><thead><tr><th>Bloque</th><th class=\"n\">Aciertos</th></tr></thead><tbody>" + rows + "</tbody></table>" +
    '<div class="nav"><button class="btn ghost" id="restart">Empezar de nuevo</button>' +
    '<button class="btn" id="review"' + (fails ? "" : " disabled") + ">Repasar falladas (" + fails + ")</button></div>";
  document.getElementById("restart").onclick = () => {
    state = { filter: state.filter, order: [], i: 0, answers: {}, shuffles: {}, review: false };
    buildOrder(); save(); render();
  };
  document.getElementById("review").onclick = () => {
    const wrong = Q.map((_, k) => k).filter(k => state.answers[k] !== undefined && state.answers[k] !== 0);
    wrong.forEach(k => { delete state.answers[k]; delete state.shuffles[k]; });
    state.review = true; state.filter = -1; state.order = wrong; state.i = 0; save(); render();
  };
}

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("a")) return;
  if (["1","2","3","4"].includes(e.key)) {
    const b = document.querySelectorAll(".opt")[+e.key - 1];
    if (b && !b.disabled) b.click();
  } else if (e.key === "Enter" || e.key === "ArrowRight") {
    const n = document.getElementById("next"); if (n && !n.disabled) { e.preventDefault(); n.click(); }
  } else if (e.key === "ArrowLeft") {
    const p = document.getElementById("prev"); if (p && !p.disabled) p.click();
  }
});

load();
if (!state.order.length) buildOrder();
render();
</script>
</body>
</html>
